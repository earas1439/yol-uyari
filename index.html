<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Yol Uyarı Yönetim</title>
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="../lib/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Yönetim paneli: uygulamayla aynı koyu sürüş paleti; masaüstünde yan menü, telefonda üst sekmeler */
:root{
  --bg:#0E151A;--panel:#172028;--panel-2:#1F2A33;--line:#2C3943;--fg:#E8EEF2;--muted:#8A99A6;
  --accent:#FF8A1F;--blue:#1F6FEB;--ok:#2FBF71;--bad:#E5484D;--warn:#E9A913;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:.01em}
h2{font-size:26px} h3{font-size:19px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Giriş */
.login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.login h1{font-size:32px}

/* Yerleşim */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--font-display);font-size:24px;font-weight:700;padding:0 10px 14px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.side button.tab{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;text-align:left;font-weight:600;color:var(--muted)}
.side button.tab svg{width:20px;height:20px;flex:none}
.side button.tab[aria-selected="true"]{background:var(--panel-2);color:var(--fg)}
.side .who{margin-top:auto;padding:10px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
main{min-width:0;padding:22px max(16px,env(safe-area-inset-right)) 40px 22px}
.view{display:flex;flex-direction:column;gap:16px;max-width:1200px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:1000;height:auto;flex-direction:row;overflow-x:auto;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));border-right:0;border-bottom:1px solid var(--line)}
  .brand,.side .who{display:none}
  .side button.tab{white-space:nowrap;padding:8px 10px}
  main{padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
}

/* Bileşenler */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-family:var(--font-display);font-size:38px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1A0E02}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:transparent;border-color:var(--bad);color:#FF8D91}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;color:var(--fg)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>*{flex:1 1 160px;min-width:0}
.row>.btn{flex:0 0 auto}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.45}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:180px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.ok{background:rgba(47,191,113,.15);color:var(--ok)}
.pill.bad{background:rgba(229,72,77,.15);color:#FF8D91}
.pill.off{background:rgba(255,138,31,.15);color:var(--accent)}
.pill.user{background:rgba(138,153,166,.15);color:var(--muted)}
.tdot{width:10px;height:10px;border-radius:50%;display:inline-block}
.err{background:#3A1517;border:1px solid var(--bad);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#F2F5F7;color:#0E1418;border-radius:12px;padding:10px 16px;font-weight:600;z-index:3000;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:calc(100% - 32px)}

/* Harita sayfası */
.mapwrap{position:relative;height:calc(100vh - 150px);min-height:420px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
@media (max-width:820px){.mapwrap{height:calc(100vh - 200px)}}
#amap{position:absolute;inset:0;background:#1a232a}
.mapwrap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.92) saturate(.6)}
.mapwrap.light .leaflet-tile-pane{filter:none}
.editor{position:absolute;right:12px;top:12px;bottom:12px;width:330px;max-width:calc(100% - 24px);z-index:600;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media (max-width:600px){.editor{top:auto;height:62%}}
.maptip{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(14,21,26,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;max-width:calc(100% - 24px)}
.mk{width:28px;height:28px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6);display:grid;place-items:center;color:#fff;font:700 10px/1 var(--font-display)}
.mk.off{border-color:#FFD089;box-shadow:0 0 0 2px #1A0E02,0 1px 4px rgba(0,0,0,.6)}
.mk.sel{outline:3px solid #fff;outline-offset:2px}
.leaflet-div-icon{background:none;border:0}

/* Grafik */
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:170px;padding-top:10px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bar i{width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.bar b{font-size:11px;font-variant-numeric:tabular-nums}
.bar span{font-size:10px;color:var(--muted)}
@media (max-width:600px){.bars{gap:3px}.bar:nth-child(even) span{visibility:hidden}.bar b{font-size:10px}}
.legend{display:grid;gap:6px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .bar2{flex:1;height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.legend .bar2 i{display:block;height:100%}
</style>
</head>
<body>

<section class="login" id="loginView" hidden>
  <form id="loginForm">
    <h1>Yol Uyarı</h1>
    <p class="muted" style="margin:0">Yönetim paneline giriş</p>
    <div class="err" id="loginErr" hidden></div>
    <label class="f">Kullanıcı adı<input type="text" id="lu" autocomplete="username" required></label>
    <label class="f">Şifre<input type="password" id="lp" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" style="justify-content:center;padding:12px">Giriş yap</button>
  </form>
</section>

<div class="app" id="appView" hidden>
  <nav class="side" role="tablist" aria-label="Bölümler">
    <div class="brand"><i></i>Yol Uyarı</div>
    <button class="tab" role="tab" data-v="ozet">Özet</button>
    <button class="tab" role="tab" data-v="harita">Harita</button>
    <button class="tab" role="tab" data-v="noktalar">Uyarı noktaları</button>
    <button class="tab" role="tab" data-v="kullanicilar">Kullanıcılar</button>
    <button class="tab" role="tab" data-v="duyurular">Toplu bildirim</button>
    <button class="tab" role="tab" data-v="ayarlar">Ayarlar</button>
    <div class="who"><span id="who"></span><a href="../" style="color:var(--accent)">Uygulamayı aç</a><button class="btn sm" id="logout">Çıkış</button></div>
  </nav>
  <main id="main"></main>
</div>

<div class="toast" id="toast" hidden></div>
<script src="../lib/leaflet.js"></script>
<script src="admin.js"></script>
</body>
</html>
