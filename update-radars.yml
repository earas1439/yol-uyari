# Türkiye radar listesini her pazartesi OpenStreetMap'ten yeniler.
# İlk seferde elle çalıştır: Actions > "Radar Listesini Güncelle" > Run workflow.
name: Radar Listesini Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OpenStreetMap'ten radarları çek
        run: python3 tools/build_radar_data.py --country TR

      - name: Değiştiyse kaydet
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/radars-tr.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Radar listesi güncellendi"
            git push
          fi
